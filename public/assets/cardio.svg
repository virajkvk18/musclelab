<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="cardioGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="60%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff1e27"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#cardioGlow)"/>

  <!-- High-Tech HUD Curves & Biometric Waveforms -->
  <g opacity="0.3">
    <!-- Grid -->
    <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Glowing Heart-Rate Pulse Curve across the screen -->
  <path d="M 0 420 L 300 420 L 340 360 L 380 490 L 420 320 L 460 460 L 500 420 L 700 420 L 740 370 L 770 480 L 810 330 L 850 450 L 890 420 L 1200 420" fill="none" stroke="url(#cyanAccent)" stroke-width="4" stroke-linecap="round"/>
  <!-- Glow Layer -->
  <path d="M 0 420 L 300 420 L 340 360 L 380 490 L 420 320 L 460 460 L 500 420 L 700 420 L 740 370 L 770 480 L 810 330 L 850 450 L 890 420 L 1200 420" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" opacity="0.25"/>

  <!-- Futuristic Curved Treadmill / HIIT Console Silhouette -->
  <g transform="translate(600, 360)">
    <!-- Base Curve of Treadmill Deck -->
    <path d="M -300 120 Q -50 160 300 90 L 290 60 Q -50 130 -290 90 Z" fill="#202530" stroke="url(#cyanAccent)" stroke-width="3"/>
    <!-- Uprights and Display Console -->
    <path d="M 180 80 L 140 -120 L 220 -130 L 250 80 Z" fill="#181d26" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <rect x="70" y="-170" width="160" height="90" rx="12" fill="#0d1117" stroke="url(#cyanAccent)" stroke-width="2"/>
    <!-- Console Screen Display -->
    <text x="150" y="-140" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle">VO2 MAX: 94%</text>
    <text x="150" y="-115" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">178 BPM</text>
    <text x="150" y="-95" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">CALORIE INCINERATION</text>
  </g>

  <!-- Telemetry Badge Overlay -->
  <g transform="translate(600, 680)">
    <rect x="-240" y="-30" width="480" height="60" rx="16" fill="rgba(10,10,14,0.85)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="'Syne', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">HIGH-OCTANE CARDIO DECK</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle" letter-spacing="1">CURVED TREADMILLS • ASSAULT BIKES • STAIRMASTERS</text>
  </g>
</svg>
